name: checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      # --- the stream (public/, no build step) ---
      - name: Parse stream-data.js
        run: node --check public/stream-data.js

      - name: Compile stream-app.jsx
        run: npx --yes esbuild@0.23.1 public/stream-app.jsx --loader:.jsx=jsx --outfile=/tmp/stream-app.js

      - name: Validate assets and data references
        run: node scripts/check-site.mjs

      # --- the Next app (/v3) ---
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Serve and smoke-test both pages
        run: |
          npx next start -p 8765 &
          for i in $(seq 1 40); do
            curl -fsS -o /dev/null "http://127.0.0.1:8765/v3" && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8765/" | grep -q "stream-app.jsx" || { echo "/ is not serving the stream"; exit 1; }
          for route in v3 stream-app.jsx stream-data.js robots.txt sitemap.xml llms.txt media/logos/askslm.png; do
            curl -fsS -o /dev/null "http://127.0.0.1:8765/$route" || { echo "failed to serve $route"; exit 1; }
          done
          echo "all routes served"
