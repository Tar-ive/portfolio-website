name: checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Serve and smoke-test the site
        run: |
          npx next start -p 8765 &
          for i in $(seq 1 40); do
            curl -fsS -o /dev/null "http://127.0.0.1:8765/" && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8765/" | grep -q "Saksham Adhikari" || { echo "/ is not serving the site"; exit 1; }
          for route in media/saksham.jpg robots.txt sitemap.xml llms.txt; do
            curl -fsS -o /dev/null "http://127.0.0.1:8765/$route" || { echo "failed to serve $route"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8765/v3")" = "308" \
            || { echo "/v3 no longer redirects"; exit 1; }
          echo "all routes served"

      # The retired stream still has to hang together in legacy/ so it can be revived.
      - name: Validate the archived stream
        run: |
          node --check legacy/stream-data.js
          npx --yes esbuild@0.23.1 legacy/stream-app.jsx --loader:.jsx=jsx --outfile=/tmp/stream-app.js
          node scripts/check-site.mjs
