name: checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Parse stream-data.js
        run: node --check stream-data.js

      - name: Compile stream-app.jsx
        run: npx --yes esbuild@0.23.1 stream-app.jsx --loader:.jsx=jsx --outfile=/tmp/stream-app.js

      - name: Validate assets and data references
        run: node scripts/check-site.mjs

      - name: Serve and smoke-test the page
        run: |
          python3 -m http.server 8765 &
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null "http://127.0.0.1:8765/index.html" && break
            sleep 0.5
          done
          for asset in index.html stream-app.jsx stream-data.js robots.txt sitemap.xml llms.txt media/logos/askslm.png; do
            curl -fsS -o /dev/null "http://127.0.0.1:8765/$asset" || { echo "failed to serve $asset"; exit 1; }
          done
          echo "all routes served"
