<link rel="stylesheet" href="_ds/saksham-design-system-f0fa3337-a9a5-4c81-a8b4-f630ece482c1/styles.css">
<style>
  /* ——— Stream layout (st-*) — composes DS tokens ——— */
  .st-page {
    max-width: var(--measure-page);
    margin: 0 auto;
    padding: var(--space-7) var(--space-6) var(--space-6);
    display: grid;
    grid-template-columns: 264px minmax(0, 1fr);
    gap: var(--space-8);
    align-items: start;
  }

  /* rail */
  .st-rail {
    position: sticky;
    top: var(--space-7);
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }
  .st-rail__mark { font-size: var(--text-xl); text-decoration: none; }
  .st-rail__bio {
    font-size: var(--text-base);
    color: var(--text-muted);
    line-height: var(--leading-normal);
    margin: 0;
    text-wrap: pretty;
  }
  .st-rail__sutra .sds-sutra__devanagari { font-size: var(--text-base); }
  .st-rail__sutra .sds-sutra__translation { font-size: var(--text-sm); }
  .st-rail__filters { display: flex; flex-direction: column; gap: 2px; }
  .st-rail__filterhead {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: var(--tracking-wider);
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: var(--space-2);
  }
  .st-filter {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--space-3);
    background: none;
    border: none;
    padding: var(--space-1) var(--space-2);
    margin: 0 calc(-1 * var(--space-2));
    border-radius: var(--radius-sm);
    font-family: var(--font-sans);
    font-size: var(--text-sm);
    color: var(--text-muted);
    cursor: pointer;
    text-align: left;
    transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
  }
  .st-filter:hover { background: var(--surface-tint); color: var(--text-body); }
  .st-filter--on { color: var(--accent-600); font-weight: 600; }
  .st-filter__n { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-faint); }
  .st-rail__foot { display: flex; flex-direction: column; gap: var(--space-4); align-items: flex-start; }
  .st-theme {
    background: none;
    border: none;
    padding: 0;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--text-faint);
    cursor: pointer;
    letter-spacing: var(--tracking-wide);
  }
  .st-theme:hover { color: var(--accent-600); }

  /* view switcher */
  .st-viewswitch {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: var(--space-2);
  }
  .st-viewswitch .st-rail__filterhead { width: 100%; margin-bottom: 0; }
  .st-view {
    background: none;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 0.2rem 0.55rem;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: var(--tracking-wide);
    color: var(--text-muted);
    cursor: pointer;
  }
  .st-view:hover { color: var(--text-body); border-color: var(--ink-2); }
  .st-view--on {
    color: var(--accent-600);
    border-color: color-mix(in oklab, var(--accent-500) 40%, transparent);
    background: var(--accent-050);
    font-weight: 600;
  }

  .st-lede {
    font-size: var(--text-sm);
    color: var(--text-muted);
    line-height: var(--leading-normal);
    margin: 0;
    text-wrap: pretty;
  }
  .st-marks {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    flex-wrap: wrap;
  }
  .st-logos {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    flex-shrink: 0;
  }
  .st-logo {
    --st-logo: var(--space-5);
    width: var(--st-logo);
    height: var(--st-logo);
    object-fit: contain;
    display: block;
    flex-shrink: 0;
    border-radius: var(--radius-sm);
  }
  .st-logo--sm { --st-logo: var(--space-4); }
  .st-logo--md { --st-logo: var(--space-5); }
  .st-logo--lg { --st-logo: var(--space-6); }
  .st-logo--hero { --st-logo: var(--space-7); }

  .st-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: var(--space-6);
    row-gap: var(--space-6);
    padding: var(--space-6) 0;
    border-top: var(--border-hairline);
    border-bottom: var(--border-hairline);
  }
  .st-stat {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);

    align-items: center;
    gap: var(--space-3);
    min-width: 0;
  }
  .st-stat__n {
    font-family: var(--font-display);
    font-size: var(--text-lg);

    line-height: var(--leading-tight);

  }
  .st-stat--big .st-stat__n { font-size: var(--text-2xl); }

    font-family: var(--font-mono);

    color: var(--text-faint);
    text-wrap: pretty;
  }
  .st-sectionhead {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: var(--tracking-wider);
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 var(--space-3);
  }
  .st-proofcard .sds-card__body {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .st-featured {
    column-count: 2;
    column-gap: var(--space-5);
  }
  .st-featured > * {
    break-inside: avoid;
    margin-bottom: var(--space-5);
    width: 100%;
    display: inline-block;
    vertical-align: top;
  }
  .st-lane__items {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-4);
  }
  .st-proofcard { overflow: hidden; }
  .st-proofcard--media .sds-card__body { padding-top: var(--space-3); }
  .st-proofcard .st-item__title { font-size: var(--text-base); }
  .st-tile__media {
    display: block;
    background: #111;
    overflow: hidden;
  }
  .st-featured .st-tile__media img {
    width: 100%;
    height: auto;
    max-height: 420px;
    object-fit: cover;
    object-position: top;
    display: block;
  }
  .st-featured .st-tile__media video {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    display: block;
  }
  .st-lane__items .st-tile__media {
    aspect-ratio: 16 / 10;
  }
  .st-lane__items .st-tile__media img,
  .st-lane__items .st-tile__media video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .st-tile__media--brand {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: var(--space-9);
    padding: var(--space-6);
    background: var(--surface-tint);
  }
  .st-tile__media--fill {
    background: #0b1c33;
    padding: 0;
    min-height: 0;
  }
  .st-tile__media--fill .st-logo {
    --st-logo: auto;
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 0;
    outline: none;

  .st-page--stack .st-feed { gap: var(--space-7); }
  .st-page--stack .st-rest .st-item__desc { display: none; }
  .st-page--stack .st-rest .st-item--paper .st-item__desc {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .st-page--stack .st-rest .st-item--paper .st-item__figure { display: none; }
  .st-page--stack .st-rest .st-gallery { margin-top: var(--space-2); }
  .st-page--stack .st-rest .st-gallery__item img { height: 140px; }
  .st-page--stack .st-rest .sds-card__body { padding: var(--space-4); }
  .st-lanes { display: flex; flex-direction: column; gap: var(--space-7); }
  .st-lane { display: flex; flex-direction: column; gap: var(--space-3); }
  .st-lane__head h2 {
    font-family: var(--font-display);
    font-size: var(--text-lg);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight);
    margin: 0;
    color: var(--text-display);
  }
  .st-lane__head p {
    margin: var(--space-1) 0 0;
    font-size: var(--text-sm);
    color: var(--text-muted);
    text-wrap: pretty;
  }

  /* feed */
  .st-feed { display: flex; flex-direction: column; gap: var(--space-6); }
  .st-group { display: flex; flex-direction: column; gap: var(--space-4); }
  .st-month { display: flex; align-items: center; gap: var(--space-3); padding-top: var(--space-2); }
  .st-month__tick { width: 14px; border-top: 2px solid var(--accent-500); }

    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: var(--tracking-wider);
    text-transform: uppercase;
    color: var(--text-faint);
    white-space: nowrap;
  }
  .st-month__rule { flex: 1; border-top: var(--border-hairline); }

  /* items */
  .st-item { position: relative; }
  .st-item__row { display: flex; gap: var(--space-5); align-items: flex-start; }
  .st-item__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .st-item__meta { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .st-item__date {

    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--text-faint);
    white-space: nowrap;
  }
  .st-item__titleline {
    display: flex;
    align-items: baseline;
    gap: var(--space-3);

  .st-item__titleline .st-item__title,
  .st-item__titleline .sds-post__title { flex: 1; min-width: 0; }
  .st-item__titleline .st-item__date { margin-left: auto; flex-shrink: 0; }
  .st-item__title {
    display: block;
    font-family: var(--font-display);
    font-size: var(--text-lg);

    line-height: var(--leading-snug);

    text-decoration: none;
    text-wrap: pretty;
    transition: color var(--duration-fast) var(--ease-out);
  }
  a.st-item__title {
    color: var(--text-display);
    text-decoration: none;
  }
  a.st-item__title:hover { color: var(--accent-600); text-decoration: none; }
  .st-item__desc {
    font-size: var(--text-base);

  }
  .st-item__cta {
    display: inline-block;

    color: var(--link);
  }
  .st-item__cta:hover { color: var(--link-hover); }
  .st-item__thumb {
    flex: 0 0 148px;

  .st-item__thumb img { display: block; width: 100%; height: 100px; object-fit: cover; }
  .st-nothumbs .st-item__thumb { display: none; }

    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .st-item--paper .st-item__title {
    font-size: var(--text-md);
    font-weight: var(--weight-medium);
    line-height: var(--leading-snug);
    letter-spacing: var(--tracking-tight);

  .st-item--paper .st-item__desc {
    font-size: var(--text-sm);
    color: var(--text-muted);

  .st-item--paper .st-item__cta,
  .st-item--win .st-item__cta { margin-top: 0; }
